# Sample settings: the development Sangam on localhost:5100 and its sample application (see sdk/README.md).
server.port=${PORT:5930}
spring.security.oauth2.client.registration.sangam.client-id=${SANGAM_CLIENT_ID:sangam-dev-sample}
spring.security.oauth2.client.registration.sangam.client-secret=${SANGAM_CLIENT_SECRET:sangam-dev-sample-secret-change-me}
spring.security.oauth2.client.registration.sangam.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.sangam.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.sangam.scope=openid,profile,email,orgs.read
spring.security.oauth2.client.registration.sangam.redirect-uri={baseUrl}/auth/callback
spring.security.oauth2.client.provider.sangam.issuer-uri=${SANGAM_AUTHORITY:http://localhost:5100}/
sangam.app-id=sangam-dev-sample
sangam.app-version=1.0.0-rc.5
sangam.environment=development
sangam.audit-buffer=${AUDIT_BUFFER:sangam-audit/pending.jsonl}
