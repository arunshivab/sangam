# rc.2 (SGM-503, ASVS V14.2.1): Dependabot opens a pull request when a dependency has a newer version, and at once
# for a security advisory. Weekly, grouped per ecosystem so updates arrive as a few pull requests, not dozens. Each
# pull request runs the full CI, so a breaking update fails its checks and is not merged. NuGet pull requests get their
# lock files regenerated by .github/workflows/dependabot-lockfiles.yml (OI-060).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdk/js
    # rc.3: @types/node follows the oldest Node the SDKs support (engines: node >= 20, CI on 22), not the newest Node;
    # newer types would let code use APIs that supported runtimes lack. Raise it when the supported range moves.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /sdk/java
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    # rc.9: the application image and the non-root Caddy image (deploy/production/caddy).
    directories: ["/", "/deploy/production/caddy"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      docker:
        patterns: ["*"]

  # rc.9 (ASVS V10.3.2): the production compose files pin caddy and postgres by digest; Dependabot proposes new digests.
  - package-ecosystem: docker-compose
    directories: ["/deploy/production", "/deploy/production/postgres"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      docker-compose:
        patterns: ["*"]
