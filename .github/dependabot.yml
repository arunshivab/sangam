# rc.2 (SGM-503, ASVS V14.2.1): Dependabot opens a pull request when a dependency has a newer version, and at once
# for a security advisory. Weekly, grouped per ecosystem so updates arrive as a few pull requests, not dozens. Each
# pull request runs the full CI, so a breaking update fails its checks and is not merged. NuGet pull requests get their
# lock files regenerated by .github/workflows/dependabot-lockfiles.yml (OI-060); Docker pull requests get global.json
# moved to the SDK in the new build image, and the lock files regenerated with it (decision of 19 Oct 2026).
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    # 26 Oct 2026: direct dependencies only. Updating a transitive one made Dependabot add PackageReferences of its
    # own (PR #60: one to the domain project, which must stay dependency-light, and a VersionOverride to 8.0.2 in a
    # test project). Transitive packages move with the direct ones; vulnerable ones are caught by CI/security.
    allow:
      - dependency-type: direct
    # rc.18 (16 Nov 2026): a new .NET major version (Microsoft.AspNetCore.*, Microsoft.Extensions.*,
    # Microsoft.EntityFrameworkCore.*, dotnet-ef) is the founder's decision, not a weekly pull request: Sangam stays on
    # the .NET 10 line (global.json) until he decides. Security releases inside .NET 10 still come as minor and patch.
    # If a pull request still adds a PackageReference or VersionOverride to a project file (PR #74 did, to the domain
    # project), close it and make the update by hand.
    ignore:
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotnet-ef"
        update-types: ["version-update:semver-major"]
      # Their major version follows EF Core's, so a new major would bring EF Core 11 with it.
      - dependency-name: "Npgsql.EntityFrameworkCore.PostgreSQL"
        update-types: ["version-update:semver-major"]
      - dependency-name: "EFCore.NamingConventions"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /sdk/js
    # rc.3: @types/node follows the oldest Node the SDKs support (engines: node >= 20, CI on 22), not the newest Node;
    # newer types would let code use APIs that supported runtimes lack. Raise it when the supported range moves.
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /sdk/python
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /sdk/java
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    # rc.9: the application image and the non-root Caddy image (deploy/production/caddy).
    directories: ["/", "/deploy/production/caddy"]
    # rc.18: the .NET images stay on the 10.0 tag (new digests, which carry .NET 10 security releases, still come);
    # moving to 11.0 is the founder's decision (PR #66 proposed it on its own).
    ignore:
      - dependency-name: "*dotnet/sdk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "*dotnet/aspnet"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      docker:
        patterns: ["*"]

  # rc.9 (ASVS V10.3.2): the production compose files pin caddy and postgres by digest; Dependabot proposes new digests.
  - package-ecosystem: docker-compose
    directories: ["/deploy/production", "/deploy/production/postgres"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    groups:
      docker-compose:
        patterns: ["*"]
