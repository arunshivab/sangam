name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  # Two explicit jobs rather than a matrix: service containers exist only on Linux
  # runners. The job names are what the branch ruleset requires — keep them stable.
  # Linux runners are pinned to ubuntu-24.04 (GitHub moves ubuntu-latest to Ubuntu 26 from 19 October 2026); the
  # job name keeps "ubuntu-latest" because the ruleset requires that exact name. Move to a newer image deliberately,
  # as its own change (SGM-912 section 7).
  build-ubuntu:
    name: build (ubuntu-latest)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sangam_identity
          POSTGRES_PASSWORD: sangam_dev
          POSTGRES_DB: sangam_identity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sangam_identity -d sangam_identity_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # Enables the [PostgresFact] tests against the service container above.
      SANGAM_TEST_CONNECTION: Host=localhost;Port=5432;Database=sangam_identity_test;Username=sangam_identity;Password=sangam_dev
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sangam.sln

      - name: Build (Release, warnings are errors)
        run: dotnet build Sangam.sln --configuration Release --no-restore

      - name: Create the in-process host test databases
        run: |
          psql "postgresql://sangam_identity:sangam_dev@localhost:5432/sangam_identity_test" -v ON_ERROR_STOP=1 -c "CREATE DATABASE sangam_identity_test_server OWNER sangam_identity;"
          psql "postgresql://sangam_identity:sangam_dev@localhost:5432/sangam_identity_test" -v ON_ERROR_STOP=1 -c "CREATE DATABASE sangam_identity_test_portal OWNER sangam_identity;"
          psql "postgresql://sangam_identity:sangam_dev@localhost:5432/sangam_identity_test" -v ON_ERROR_STOP=1 -c "CREATE DATABASE sangam_identity_test_admin OWNER sangam_identity;"
          psql "postgresql://sangam_identity:sangam_dev@localhost:5432/sangam_identity_test" -v ON_ERROR_STOP=1 -c "CREATE DATABASE sangam_identity_test_partner OWNER sangam_identity;"
          psql "postgresql://sangam_identity:sangam_dev@localhost:5432/sangam_identity_test" -v ON_ERROR_STOP=1 -c "CREATE DATABASE sangam_identity_test_imagiqa OWNER sangam_identity;"

      - name: Test (including PostgreSQL-backed tests)
        run: dotnet test Sangam.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-ubuntu-latest
          path: TestResults

  build-windows:
    name: build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sangam.sln

      - name: Build (Release, warnings are errors)
        run: dotnet build Sangam.sln --configuration Release --no-restore

      - name: Test (PostgreSQL-backed tests are skipped on Windows)
        run: dotnet test Sangam.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-latest
          path: TestResults

  format:
    name: format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sangam.sln

      - name: Verify formatting and style
        run: dotnet format Sangam.sln --verify-no-changes --no-restore

  # rc.2: a change to an entity or its configuration must come with its migration. Fails when the model differs from
  # the last migration's snapshot, for Sangam's database and for the imagiQa sample's. Needs no database.
  migrations:
    name: migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore (solution and the dotnet-ef tool from .config)
        run: |
          dotnet restore Sangam.sln
          dotnet tool restore

      - name: Sangam (Sangam.Identity.Infrastructure)
        run: dotnet ef migrations has-pending-model-changes --project src/Sangam.Identity.Infrastructure --startup-project src/Sangam.Identity.Infrastructure

      - name: imagiQa sample (Imagiqa.Web)
        run: dotnet ef migrations has-pending-model-changes --project samples/Imagiqa.Web --startup-project samples/Imagiqa.Web

  # R6: the JavaScript/TypeScript, Python and Java SDKs, each running the shared conformance vectors
  # (sdk/conformance/vectors.json) and its own tests. A required check since R7.
  sdks:
    name: sdks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: JavaScript and TypeScript (@sangam/client, @sangam/node, @sangam/react, sample)
        working-directory: sdk/js
        run: |
          npm ci
          npm run build
          npm test

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Python (sangam-client, FastAPI and Flask adapters)
        working-directory: sdk/python
        run: |
          pip install -e ".[test]"
          pytest -q

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Java (sangam-client, sangam-spring, sample)
        working-directory: sdk/java
        run: mvn -B -ntp verify

  # R7 (SGM-503): known vulnerabilities in every dependency and in the container image. Fails on high or critical.
  # A required check since R7.
  security:
    name: security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: NuGet packages, direct and transitive
        run: |
          dotnet restore Sangam.sln
          bash tools/security/dotnet-vulnerable.sh Sangam.sln

      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm (sdk/js)
        working-directory: sdk/js
        run: |
          npm ci
          npm audit --audit-level=high

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Python (sdk/python, with every extra)
        working-directory: sdk/python
        run: |
          pip install pip-audit -e ".[test,fastapi,flask]"
          pip-audit --skip-editable

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Java dependencies resolved for the scanner
        working-directory: sdk/java
        # install first: the sibling modules (sangam-client) are not on Maven Central, only in this reactor.
        run: mvn -B -ntp -q -DskipTests install dependency:resolve dependency:resolve-plugins

      # Reviewed exceptions are in .trivyignore.yaml; the kind overlay's test-only services are not scanned.
      - name: Trivy, the repository (every lockfile and pom, secrets, Dockerfile, Kubernetes manifests)
        run: >
          docker run --rm -v "$PWD:/src:ro" -v "$HOME/.m2/repository:/root/.m2/repository:ro" -w /src
          ghcr.io/aquasecurity/trivy:0.75.0 fs --exit-code 1 --severity HIGH,CRITICAL
          --scanners vuln,secret,misconfig --offline-scan --ignorefile .trivyignore.yaml
          --skip-dirs deploy/kubernetes/overlays/kind .

      - name: Trivy, the identity image (fixable high and critical)
        run: |
          docker build --target app -t sangam/identity:ci .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock ghcr.io/aquasecurity/trivy:0.75.0 \
            image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed sangam/identity:ci

      # ASVS V1.14.3: the third-party images the production stack runs, reported (not failing: fixes are upstream's).
      - name: Trivy, the caddy and postgres images (report)
        run: |
          for image in caddy:2 postgres:18; do
            docker run --rm ghcr.io/aquasecurity/trivy:0.75.0 image --severity HIGH,CRITICAL --ignore-unfixed "$image"
          done

      # PR-33: the Kubernetes manifests render and match the Kubernetes schemas.
      - name: Kubernetes manifests (kustomize and kubeconform)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for overlay in deploy/kubernetes/base deploy/kubernetes/overlays/kind; do
            kubectl kustomize "$overlay" | ./kubeconform -strict -summary -ignore-missing-schemas
          done

      # ASVS V14.2.5: a software bill of materials (CycloneDX) for the repository and for the identity image.
      - name: SBOM (CycloneDX)
        run: |
          mkdir -p sbom
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/sbom:/out" -v "$HOME/.m2/repository:/root/.m2/repository:ro" \
            ghcr.io/aquasecurity/trivy:0.75.0 fs --offline-scan --format cyclonedx --output /out/sangam-repository.cdx.json /src
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/sbom:/out" \
            ghcr.io/aquasecurity/trivy:0.75.0 image --format cyclonedx --output /out/sangam-identity-image.cdx.json sangam/identity:ci
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom
