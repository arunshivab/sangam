name: Dependabot lock files

# OI-060 (decision of 19 Oct 2026): Dependabot's NuGet pull requests change Directory.Packages.props and the lock files
# of the projects that reference a package directly, but not of the projects that get it through another project, so
# locked restore fails with NU1004 (as #47 did). This job regenerates every lock file on Dependabot's own NuGet branches
# and pushes them back to the pull request; CI then runs again on that commit.
#
# Decision of 19 Oct 2026: Dependabot's Docker pull requests move the SDK build image in the Dockerfile, but global.json
# pins the SDK exactly (rollForward: disable), so the image cannot build (as #46 could not). On Dependabot's Docker
# branches this job also reads the SDK version from the new image's configuration in the registry (nothing from the
# image is run), moves global.json to it and regenerates the lock files with that SDK (a new SDK can bring new framework
# assets, as 10.0.402 did). It moves only within the feature band global.json already names (10.0.4xx, say) and only
# forward; anything else stops for a person.
#
# Safety: it runs only for pull requests Dependabot opened, from a branch in this repository whose name starts
# dependabot/nuget/ or dependabot/docker/, and only when Dependabot itself pushed (so its own push does not start it
# again). It runs `dotnet restore` and nothing else: no build, no tests. It pushes with a deploy key that can write to
# this repository only (secret LOCKFILE_DEPLOY_KEY; a push with the built-in token would not start CI again), and only
# to that branch. Lock files, and global.json on Docker branches, are the only things it may change; anything else and
# it stops without pushing.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependabot-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  lockfiles:
    name: regenerate lock files
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
          || startsWith(github.event.pull_request.head.ref, 'dependabot/docker/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOCKER_BRANCH: ${{ startsWith(github.event.pull_request.head.ref, 'dependabot/docker/') }}
    steps:
      - name: Check out Dependabot's branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          ssh-key: ${{ secrets.LOCKFILE_DEPLOY_KEY }}

      - name: Move global.json to the SDK in the build image
        if: env.DOCKER_BRANCH == 'true'
        run: |
          set -euo pipefail
          image="$(awk '$1 == "FROM" && $2 ~ /^mcr\.microsoft\.com\/dotnet\/sdk:/ { print $2; exit }' Dockerfile)"
          if ! [[ "$image" =~ ^mcr\.microsoft\.com/dotnet/sdk:[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::The Dockerfile's SDK image is not pinned as dotnet/sdk:<major.minor>@sha256:<digest> ($image)."
            exit 1
          fi
          repo="https://mcr.microsoft.com/v2/dotnet/sdk"
          digest="${image##*@}"
          accept="application/vnd.oci.image.index.v1+json"
          accept="$accept,application/vnd.docker.distribution.manifest.list.v2+json"
          accept="$accept,application/vnd.oci.image.manifest.v1+json"
          accept="$accept,application/vnd.docker.distribution.manifest.v2+json"
          amd64="$(curl -fsSL -H "Accept: $accept" "$repo/manifests/$digest" \
            | jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' \
            | head -n 1)"
          config="$(curl -fsSL -H "Accept: $accept" "$repo/manifests/$amd64" | jq -r '.config.digest')"
          sdk="$(curl -fsSL "$repo/blobs/$config" | jq -r '.config.Env[]' | sed -n 's/^DOTNET_SDK_VERSION=//p')"
          current="$(jq -r '.sdk.version' global.json)"
          echo "Image $image has SDK $sdk; global.json names $current."
          if ! [[ "$sdk" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not read the SDK version from the image ($sdk)."
            exit 1
          fi
          # Same feature band only (10.0.4xx stays 10.0.4xx); a new band or major is a person's decision.
          if [ "${sdk%??}" != "${current%??}" ]; then
            echo "::error::The image's SDK $sdk is outside the feature band of global.json ($current); move it by hand."
            exit 1
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$sdk" | sort -V | tail -n 1)" != "$sdk" ]; then
            echo "::error::The image's SDK $sdk is older than global.json ($current); not moving back."
            exit 1
          fi
          if [ "$sdk" != "$current" ]; then
            jq --arg v "$sdk" '.sdk.version = $v' global.json > global.json.new
            mv global.json.new global.json
            echo "global.json moved to $sdk."
          fi

      - name: Set up .NET (from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Regenerate every lock file
        run: dotnet restore Sangam.sln --force-evaluate

      - name: Check that only lock files changed
        id: changes
        run: |
          changed="$(git status --porcelain)"
          if [ -z "$changed" ]; then
            echo "Lock files already match; nothing to push."
            echo "push=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$changed"
          allowed='packages\.lock\.json$'
          if [ "$DOCKER_BRANCH" = "true" ]; then
            allowed='(packages\.lock\.json|^global\.json)$'
          fi
          if git status --porcelain | awk '{print $2}' | grep -Ev "$allowed"; then
            echo "::error::Something other than a lock file (or global.json) changed; not pushing."
            exit 1
          fi
          echo "push=true" >> "$GITHUB_OUTPUT"

      - name: Locked restore passes now
        if: steps.changes.outputs.push == 'true'
        run: dotnet restore Sangam.sln --locked-mode

      - name: Push the changes to the pull request
        if: steps.changes.outputs.push == 'true'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "sangam-lockfiles"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*packages.lock.json'
          message="Regenerate lock files for Dependabot's NuGet update"
          if [ "$DOCKER_BRANCH" = "true" ]; then
            git add -- global.json
            message="Move global.json to the image's SDK $(jq -r '.sdk.version' global.json) and regenerate lock files"
          fi
          git commit -m "$message"
          git push origin "HEAD:${HEAD_REF}"
