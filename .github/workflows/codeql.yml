name: CodeQL

# rc.2 (SGM-503): static analysis of every language in the repository, on each pull request, on main, and weekly
# (new queries find old code). Alerts appear under Security -> Code scanning. The ruleset's "Require code scanning
# results" rule turns high and critical security alerts into a failed check on the pull request.
# rc.4: the gate runs the security-extended suite only. The code-quality queries (security-and-quality) run once per
# release by hand with tools/security/codeql-quality.sh; see docs/security/README.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 21 * * 0"   # Sunday 21:23 UTC (Monday 02:53 IST)
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: java-kotlin
            build-mode: manual
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET (from global.json)
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Set up Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Initialise CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.github/codeql/codeql-config.yml

      - name: Build the .NET solution
        if: matrix.language == 'csharp'
        run: dotnet build Sangam.sln --configuration Release

      - name: Build the Java SDK
        if: matrix.language == 'java-kotlin'
        working-directory: sdk/java
        run: mvn -B -ntp -DskipTests install

      - name: Analyse
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
