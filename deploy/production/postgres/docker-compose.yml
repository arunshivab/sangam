# Sangam - PostgreSQL, its own stack (OI-013), on the E2E VM (D-023).
# D-F (founder's decision, 7 October 2026): PostgreSQL 18 everywhere - production, CI and local.
name: sangam-db

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - sangam-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ../secrets/postgres_password

volumes:
  pgdata:

networks:
  sangam-db:
    name: sangam-db
