# Sangam - PostgreSQL, its own stack (OI-013), on the E2E VM (D-023).
# D-F (founder's decision, 7 October 2026): PostgreSQL 18 everywhere - production, CI and local.
name: sangam-db

services:
  postgres:
    image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
    restart: unless-stopped
    # rc.9 (ASVS V1.14.5): a read-only filesystem but for the data, the socket directory and /tmp; only the capabilities
    # the image's start-up needs to hand over to the postgres user; no privilege gain; memory and process limits.
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777", "/var/run/postgresql:size=1m,mode=2777"]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 2g
    shm_size: 256m
    pids_limit: 512
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql
      - ../../postgres/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - sangam-db
      # rc.9 (ASVS V1.14.1): the demo's separate network to the database.
      - sangam-demo-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

secrets:
  postgres_password:
    file: ../secrets/postgres_password

volumes:
  pgdata:

networks:
  sangam-db:
    name: sangam-db
  sangam-demo-db:
    name: sangam-demo-db
