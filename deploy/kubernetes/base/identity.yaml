# The identity server: sign-in, OpenID Connect, SAML, the management API, background delivery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: sangam
  labels:
    app.kubernetes.io/name: identity
    app.kubernetes.io/part-of: sangam
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: sangam
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      # Replicas on different nodes where there are several, so one node going down leaves the service up.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          # Nodes that cannot take the pod (a control plane's taint) do not count as places to spread to.
          nodeTaintsPolicy: Honor
          # Spread each revision on its own, so a rolling update ends balanced.
          matchLabelKeys: [pod-template-hash]
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: identity
      containers:
        - name: identity
          image: sangam/identity:1.0.0-rc.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: sangam-common
            - configMapRef:
                name: sangam-identity
          env: []
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          # Stay up ten seconds after being told to stop, until the ingress has stopped sending new requests here.
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: audit-archive
              mountPath: /var/lib/sangam/audit-archive
      volumes:
        - name: secrets
          projected:
            sources:
              - secret:
                  name: sangam-shared
              - secret:
                  name: sangam-identity
        - name: tmp
          emptyDir: {}
        # D-A: the audit archive. Every replica mounts it; one at a time writes (a PostgreSQL advisory lock), so it
        # must be ReadWriteMany storage (README, "Storage").
        - name: audit-archive
          persistentVolumeClaim:
            claimName: sangam-audit-archive
---
apiVersion: v1
kind: Service
metadata:
  name: identity
  namespace: sangam
  labels:
    app.kubernetes.io/name: identity
spec:
  selector:
    app.kubernetes.io/name: identity
  ports:
    - name: http
      port: 80
      targetPort: http
---
# A voluntary disruption (node drain, upgrade) never takes the last replica.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: identity
  namespace: sangam
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: identity
