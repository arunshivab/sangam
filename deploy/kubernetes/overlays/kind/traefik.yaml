# Traefik as the ingress controller for the local proof (two replicas, NodePort 30443 for HTTPS).
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  namespace: traefik
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik
rules:
  - apiGroups: [""]
    resources: [services, secrets, nodes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses, ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [extensions, networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: traefik
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: traefik
subjects:
  - kind: ServiceAccount
    name: traefik
    namespace: traefik
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  namespace: traefik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.5
          imagePullPolicy: IfNotPresent
          args:
            - --entryPoints.websecure.address=:8443
            - --entryPoints.websecure.forwardedHeaders.insecure=false
            - --providers.kubernetesingress
            - --providers.kubernetesingress.allowEmptyServices=true
            - --ping
            - --log.level=INFO
          ports:
            - name: websecure
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  namespace: traefik
spec:
  type: NodePort
  # A fixed address, so the Sangam pods can reach the public host names through the ingress (hostAliases).
  clusterIP: 10.96.0.200
  selector:
    app: traefik
  ports:
    # https://*.sangam.test:8443 from this machine (kind maps 8443 to the node port) and from the pods (hostAliases).
    - name: websecure
      port: 8443
      targetPort: websecure
      nodePort: 30443
