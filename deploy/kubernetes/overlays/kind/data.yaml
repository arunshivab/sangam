# Test-only services in their own namespace: a single PostgreSQL (production uses a managed or replicated PostgreSQL,
# README "Database") and a stand-in for Anjal that keeps every message it is given, so the proof can read the codes.
apiVersion: v1
kind: Namespace
metadata:
  name: sangam-data
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: sangam-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: sangam
            - name: POSTGRES_DB
              value: sangam
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, sangam]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: sangam-data
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: anjal-stub
  namespace: sangam-data
data:
  stub.py: |
    # Answers Sangam's Anjal calls (docs/anjal-messaging-contract.md) and prints each message as one JSON line.
    import json, sys, uuid
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class H(BaseHTTPRequestHandler):
        def body(self):
            if self.headers.get('Transfer-Encoding', '').lower() == 'chunked':
                data = b''
                while True:
                    size = int(self.rfile.readline().strip() or b'0', 16)
                    if size == 0:
                        self.rfile.readline()
                        return data
                    data += self.rfile.read(size)
                    self.rfile.readline()
            return self.rfile.read(int(self.headers.get('Content-Length', 0) or 0))
        def do_POST(self):
            body = self.body()
            print(json.dumps({'path': self.path, 'body': json.loads(body or b'{}')}), flush=True)
            out = json.dumps({'id': uuid.uuid4().hex}).encode()
            self.send_response(202); self.send_header('Content-Type', 'application/json'); self.end_headers(); self.wfile.write(out)
        def do_GET(self):
            self.send_response(200); self.send_header('Content-Type', 'application/json'); self.end_headers(); self.wfile.write(b'{"status":"ok"}')
        def log_message(self, *args):
            pass
    HTTPServer(('', 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: anjal
  namespace: sangam-data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: anjal
  template:
    metadata:
      labels:
        app: anjal
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: anjal
          image: python:3.13-alpine
          imagePullPolicy: IfNotPresent
          command: [python, -u, /stub/stub.py]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: stub
              mountPath: /stub
      volumes:
        - name: stub
          configMap:
            name: anjal-stub
---
apiVersion: v1
kind: Service
metadata:
  name: anjal
  namespace: sangam-data
spec:
  selector:
    app: anjal
  ports:
    - port: 8080
