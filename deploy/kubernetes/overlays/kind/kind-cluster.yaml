# A local cluster to prove the Kubernetes and high-availability path (R7, PR-33): one control plane and two workers,
# so replicas really run on different nodes, and a worker can be taken away.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: sangam
nodes:
  - role: control-plane
    extraPortMappings:
      # Traefik's HTTPS NodePort, reachable on this machine as https://*.sangam.test:8443/.
      - containerPort: 30443
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
