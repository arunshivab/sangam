# Sangam — container stack: PostgreSQL 16 + Caddy.
#
# This is NOT required for local development on a laptop. The default local
# setup is a native PostgreSQL 16 install (scripts/bootstrap-dev.ps1). This file
# serves two purposes:
#   1. the E2E Networks VM, where Caddy is the TLS-terminating front door for
#      id./account./admin.sangamid.in (and Anjal on the same box) — PR-08;
#   2. developers who prefer containers:  .\scripts\bootstrap-dev.ps1 -WithDocker
#      or  docker compose -f deploy/docker-compose.dev.yml up -d
#
# Locally, Caddy fronts the three hosts you run with `dotnet run`:
#   https://id.localhost       -> http://host.docker.internal:5100  (Sangam.Identity.Server)
#   https://account.localhost  -> http://host.docker.internal:5200  (Sangam.SelfService.Web)
#   https://admin.localhost    -> http://host.docker.internal:5300  (Sangam.Admin.Web)
# *.localhost resolves to 127.0.0.1 in every modern browser. Caddy issues
# certificates from its own local CA; trust it once with
# `docker compose -f deploy/docker-compose.dev.yml exec caddy caddy trust`.

name: sangam-dev

services:
  postgres:
    image: postgres:16
    container_name: sangam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${SANGAM_PG_SUPERUSER_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${SANGAM_PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/10-sangam.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 12

  caddy:
    image: caddy:2
    container_name: sangam-caddy
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
